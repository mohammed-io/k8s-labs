apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
          name: http
        # TODO: Add resource requests and limits
        # HINT: Add resources.requests.cpu: 100m, memory: 128Mi
        # HINT: Add resources.limits.cpu: 200m, memory: 256Mi
